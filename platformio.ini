 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Restructure in progress (see .claude/plans — platform/core/gui split).
; Phase 2: platform/ HAL bodies are real now (FlexCAN_T4/ILI948x_t4_mm/SPI
; touch/EEPROM on Teensy; raw SDL2/file config/SDL_GetTicks on simulator).
; Phase 3: core/time, core/can, core/vehicle are real now (scheduler, UDS
; client, signal catalog + store). Phase 4: core/config is real now
; (schema, defaults, migration, ConfigStore over IConfigStore). Phase 5:
; gui/theme + gui/widgets are real now (Theme tokens, PanelWidget driven by
; fabricated PanelViewModels). Phase 6: gui/screens + gui/bindings are real
; now (compute_layout, InfoScreen/ConfiguratorScreen/WarningConfigScreen/
; SettingsScreen, VehicleBinding wiring core:: to gui/widgets).
;
; Separately, env:esp32c3 is the companion ESP32-C3 relay firmware (see
; platform/esp32/README.md) — the other end of the remote/protocol wire
; format env:teensymm/env:simulator already speak via remote/server.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    +<*>
    +<../platform/teensy/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/teensy/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

; Stamps `git describe` into fw_version.h for platform_firmware_version()
; -- the Teensy is release hardware (tools/release.py).
extra_scripts = pre:tools/fw_version.py

; Bench stress test on the Teensy: env:teensymm with the synthetic CAN bus
; in place of FlexCAN, the same sweeping fabricated data env:dash_s3_stress
; shows, and the same STRESS_TEST backlight behaviour. Touch stays
; capacitive (teensy_platform.cpp's default).
;   pio run -e teensymm_stress -t upload
[env:teensymm_stress]
extends     = env:teensymm
build_flags =
    ${env:teensymm.build_flags}
    -D TEENSY_FAKE_CAN=1
    -D STRESS_TEST=1

[env:simulator]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    +<*>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/
    ; Same snapshot slides as env:dash_s3, so the simulator shows them.
    -D GUI_SNAPSHOT_TRANSITIONS=1
    -lSDL2

; The dash product on its own PCB (ESP32-S3 N16R2: 16MB quad flash, 2MB
; quad PSRAM embedded in the chip -- esptool reports "Embedded PSRAM 2MB
; (AP_3v3)"). env:dash_s3_devkit below is the same firmware for the
; N16R8 ESP32-S3-DevKitC-1 bench setup. Same src/main.cpp and the same core/gui/remote sources as
; env:teensymm; only the board layer differs -- platform/esp32_common
; (MCU-level: clock, NVS config store, LittleFS) plus platform/dash_s3
; (board-level: ILI9488 over 8-bit i80 rendered whole-frame from PSRAM and
; pushed on the panel's TE pulse, FT6236, TWAI). There is no C3: the S3's
; own Wi-Fi runs the C3's relay code (platform/esp32, minus its main.cpp)
; in-process, over an in-memory pipe to remote/server.
; Every pin is a -D with a default in platform/dash_s3/inc/dash_s3_pins.hpp;
; override here after wiring, don't edit a driver.
;   pio run -e dash_s3 -t upload ; pio device monitor -e dash_s3
[env:dash_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; The quad-PSRAM chip needs the qio_qspi precompiled SDK variant (qio_opi
; fails PSRAM init with "PSRAM ID read error ... wrong PSRAM line mode");
; the board json defaults to the no-PSRAM 8MB part, so flash size and the
; partition table (two OTA app slots, the rest LittleFS -- see
; platform/dash_s3/OTA_PLAN.md) are ours too. Two full-screen frame
; buffers are ~600KB, well inside 2MB.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = platform/dash_s3/partitions_dash.csv
board_build.filesystem          = littlefs

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Arduino-ESP32 2.x defaults to gnu++11; core/ needs C++17.
build_unflags = -std=gnu++11

; The in-process relay serves the same phone configurator page as
; env:esp32c3, plus the firmware update page -- see tools/web/embed_web.py.
; fw_version.py stamps `git describe` into the image's update descriptor
; (platform/dash_s3/src/dash_s3_firmware.cpp).
extra_scripts =
    pre:tools/web/embed_web.py
    pre:tools/fw_version.py

; Teensy-only vendored libs. Nothing here includes them; this keeps the
; dependency finder from ever considering them.
lib_ignore = FlexCAN_T4, ILI948x_t4_mm
; The in-process relay's Wi-Fi/HTTP dependencies -- see env:esp32c3.
lib_deps   = WiFi, WebServer

build_src_filter =
    +<*>
    +<../platform/esp32_common/src>
    +<../platform/dash_s3/src>
    +<../platform/esp32/src>
    -<../platform/esp32/src/main.cpp>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/simulator/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_DASH_S3
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; Without this the core disables its PSRAM init even though the
    ; qio_opi SDK libs are built with it on.
    -D BOARD_HAS_PSRAM
    ; Serial over the native USB port (USB-Serial/JTAG; the board json
    ; already sets ARDUINO_USB_MODE=1). The PCB doesn't route UART0's
    ; 43/44, so without this the console, USB log export and the SLCAN
    ; sniffer all go nowhere.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Fifth-of-a-screen LVGL draw bands (src/main.cpp) instead of the
    ; default tenth: a full redraw ~40% faster, for ~61KB more internal
    ; RAM. A quarter is faster still but leaves only ~13KB of internal
    ; heap with the SoftAP up.
    ;
    ; Internal RAM is the budget to watch on this board: the Wi-Fi stack's
    ; transmit buffers come out of it, and with the SoftAP up and a phone
    ; loading the config page there is only ~20-30KB left. At ~19KB the
    ; page stalled mid-send and never loaded (2026-10-25). Measured on the
    ; PCB, idle, AP down: 47KB free before OTA, 58KB after moving
    ; mallocs over 2KB to PSRAM (dash_s3_platform.cpp) and building the
    ; update screen only on demand. Re-measure after anything that adds
    ; resident LVGL screens or static buffers.
    -D DRAW_BUF_DIVISOR=5
    ; Screen slides animate a one-off snapshot of the incoming screen
    ; instead of re-rendering it every frame (gui/screens
    ; screen_transition.hpp). ~300KB of PSRAM per slide.
    -D GUI_SNAPSHOT_TRANSITIONS=1
    ; loopTask defaults to 8KB; LVGL's software renderer and the 96px
    ; fonts want more headroom than that.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D CORE_DEBUG_LEVEL=2
    ; core::Logger's ring, in 256KB chunks: 11MiB, down from the default
    ; 13MiB to make room for the second OTA app slot (partitions_dash.csv).
    -D LOG_CHUNK_COUNT=44
    -I platform/
    -I platform/esp32_common/inc
    -I platform/dash_s3/inc
    -I platform/esp32/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

; The N16R8 ESP32-S3-DevKitC-1 bench setup: octal PSRAM, which needs the
; qio_opi SDK variant, the resistive XPT2046 breakout instead of the
; PCB's FT6236, and the dev kit's header wiring in place of the PCB's
; pinout (dash_s3_pins.hpp's defaults).
;   pio run -e dash_s3_devkit -t upload
[env:dash_s3_devkit]
extends                         = env:dash_s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:dash_s3.build_flags}
    -D DASH_S3_TOUCH_USE_RESISTIVE=1
    ; Stamped into the update descriptor: an OTA upload is refused unless
    ; it was built for the same hardware (dash_s3_firmware.hpp).
    -D DASH_S3_HW_VARIANT=\"devkit\"
    -D DASH_S3_PIN_LCD_D0=4
    -D DASH_S3_PIN_LCD_D1=5
    -D DASH_S3_PIN_LCD_D2=6
    -D DASH_S3_PIN_LCD_D3=7
    -D DASH_S3_PIN_LCD_D4=15
    -D DASH_S3_PIN_LCD_D5=16
    -D DASH_S3_PIN_LCD_D6=17
    -D DASH_S3_PIN_LCD_D7=18
    -D DASH_S3_PIN_LCD_WR=8
    -D DASH_S3_PIN_LCD_DC=9
    -D DASH_S3_PIN_LCD_CS=10
    -D DASH_S3_PIN_LCD_RST=11
    -D DASH_S3_PIN_LCD_BL=12
    -D DASH_S3_PIN_LCD_TE=47
    -D DASH_S3_PIN_TOUCH_SDA=13
    -D DASH_S3_PIN_TOUCH_SCL=14
    -D DASH_S3_PIN_TOUCH_RST=21
    -D DASH_S3_PIN_CAN_TX=41
    -D DASH_S3_PIN_CAN_RX=42
    ; Octal PSRAM has the bandwidth for the faster bus.
    -D DASH_S3_LCD_BUS_HZ=20000000

; Bench stress test: env:dash_s3 with the simulator's synthetic CAN bus in
; place of TWAI (sweeping fast and wide, unlike the simulator's gentle
; wobble) so every readout moves with no vehicle or transceiver attached,
; plus a once-a-second LCD throughput line on the console. STRESS_TEST is
; the one flag src/main.cpp itself reads: it keeps the backlight on through
; an accent/theme rebuild so the redraw can be watched. Its update
; descriptor says "pcb-stress" (dash_s3_firmware.hpp), so it can never be
; installed over the air onto a dash running real firmware, nor the
; reverse -- USB only, and never part of a release (tools/release.py).
;   pio run -e dash_s3_stress -t upload
[env:dash_s3_stress]
extends     = env:dash_s3
build_flags =
    ${env:dash_s3.build_flags}
    -D DASH_S3_FAKE_CAN=1
    -D DASH_S3_LCD_STATS=1
    -D STRESS_TEST=1

; Standalone passive CAN->USB sniffer firmware for the Mac monitor tool
; (tools/monitor). Its own program with setup()/loop() -- shares only the
; FlexCAN_T4 library and core/can's SLCAN codec with the display firmware
; (whose own sniffer mode speaks the same protocol). Speaks SLCAN over USB so
; python-can's `slcan` backend can drive it. See platform/teensy/tools/
; can_sniffer.cpp and tools/README.md. Flash: pio run -e can_sniffer -t upload
[env:can_sniffer]
platform  = teensy
board     = teensy40
framework = arduino

build_src_filter =
    -<*>
    +<../platform/teensy/tools/can_sniffer.cpp>
    +<../core/can/src/slcan.cpp>

build_flags =
    -I platform/
    -I core/can/inc
    -I lib/

[env:esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

; The relay's Wi-Fi/HTTP dependencies, named rather than discovered: the
; dependency finder only follows includes from the sources it compiles,
; not from headers under -I, and main.cpp reaches these through
; relay_app.hpp.
lib_deps = WiFi, WebServer

build_src_filter =
    -<*>
    +<../platform/esp32/src>
    +<../remote/protocol/src>

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I platform/
    -I platform/esp32/inc
    -I remote/protocol/inc

monitor_speed = 115200

; Gzips platform/esp32/web/index.html into the firmware on every build --
; see tools/web/embed_web.py. fw_version.py stamps the version the relay
; prints on USB at boot.
extra_scripts =
    pre:tools/web/embed_web.py
    pre:tools/fw_version.py
