 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Restructure in progress (see .claude/plans — platform/core/gui split).
; Phase 2: platform/ HAL bodies are real now (FlexCAN_T4/ILI948x_t4_mm/SPI
; touch/EEPROM on Teensy; raw SDL2/file config/SDL_GetTicks on simulator).
; Phase 3: core/time, core/can, core/vehicle are real now (scheduler, UDS
; client, signal catalog + store). Phase 4: core/config is real now
; (schema, defaults, migration, ConfigStore over IConfigStore). Phase 5:
; gui/theme + gui/widgets are real now (Theme tokens, PanelWidget driven by
; fabricated PanelViewModels). Phase 6: gui/screens + gui/bindings are real
; now (compute_layout, InfoScreen/ConfiguratorScreen/WarningConfigScreen/
; SettingsScreen, VehicleBinding wiring core:: to gui/widgets).
;
; Separately, env:esp32c3 is the companion ESP32-C3 relay firmware (see
; platform/esp32/README.md) — the other end of the remote/protocol wire
; format env:teensymm/env:simulator already speak via remote/server.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    +<*>
    +<../platform/teensy/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/teensy/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

[env:simulator]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    +<*>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/
    -lSDL2

; Standalone passive CAN->USB sniffer firmware for the Mac monitor tool
; (tools/monitor). Its own program with setup()/loop() -- shares nothing with
; the display firmware except the FlexCAN_T4 library. Speaks SLCAN over USB so
; python-can's `slcan` backend can drive it. See platform/teensy/tools/
; can_sniffer.cpp and tools/README.md. Flash: pio run -e can_sniffer -t upload
[env:can_sniffer]
platform  = teensy
board     = teensy40
framework = arduino

build_src_filter =
    -<*>
    +<../platform/teensy/tools/can_sniffer.cpp>

build_flags =
    -I lib/

[env:esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_src_filter =
    -<*>
    +<../platform/esp32/src>
    +<../remote/protocol/src>

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I platform/esp32/inc
    -I remote/protocol/inc

monitor_speed = 115200

; Host-native layout preview for the phone config form -- no hardware, no
; RelayLink/WebServer, just the real render_config_page() (shared with
; env:esp32c3) fed fabricated sample data. See platform/esp32/README.md.
[env:web_preview]
platform    = native
lib_archive = false

build_src_filter =
    -<*>
    +<../platform/esp32/tools>
    +<../platform/esp32/src/config_page_render.cpp>
    +<../core/vehicle/src>
    +<../core/can/src>

build_flags =
    -std=gnu++17
    -I platform/
    -I platform/esp32/inc
    -I core/vehicle/inc
    -I core/can/inc
    -I remote/protocol/inc
