; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Restructure in progress (see .claude/plans — platform/core/gui split).
; Phase 1: platform/ shell only. core/ and gui/ build_src_filter entries
; and the simulator's SDL2/LVGL flags return in later phases as those
; directories come online.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    +<*>
    +<../platform/teensy/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -I platform/
    -I platform/teensy/inc

[env:simulator]
platform = native

build_src_filter =
    +<*>
    +<../platform/simulator/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -D PLATFORM_SIMULATOR
    -I platform/
    -I platform/simulator/inc
