; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Restructure in progress (see .claude/plans — platform/core/gui split).
; Phase 2: platform/ HAL bodies are real now (FlexCAN_T4/ILI948x_t4_mm/SPI
; touch/EEPROM on Teensy; raw SDL2/file config/SDL_GetTicks on simulator).
; Phase 3: core/time, core/can, core/vehicle are real now (scheduler, UDS
; client, signal catalog + store). Phase 4: core/config is real now
; (schema, defaults, migration, ConfigStore over IConfigStore). gui/
; build_src_filter entries and LVGL come online in later phases.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    +<*>
    +<../platform/teensy/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -I platform/
    -I platform/teensy/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc

[env:simulator]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    +<*>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -lSDL2
