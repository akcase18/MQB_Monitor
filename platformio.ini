 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Restructure in progress (see .claude/plans — platform/core/gui split).
; Phase 2: platform/ HAL bodies are real now (FlexCAN_T4/ILI948x_t4_mm/SPI
; touch/EEPROM on Teensy; raw SDL2/file config/SDL_GetTicks on simulator).
; Phase 3: core/time, core/can, core/vehicle are real now (scheduler, UDS
; client, signal catalog + store). Phase 4: core/config is real now
; (schema, defaults, migration, ConfigStore over IConfigStore). Phase 5:
; gui/theme + gui/widgets are real now (Theme tokens, PanelWidget driven by
; fabricated PanelViewModels). Phase 6: gui/screens + gui/bindings are real
; now (compute_layout, InfoScreen/ConfiguratorScreen/WarningConfigScreen/
; SettingsScreen, VehicleBinding wiring core:: to gui/widgets).
;
; Separately, env:esp32c3 is the companion ESP32-C3 relay firmware (see
; platform/esp32/README.md) — the other end of the remote/protocol wire
; format env:teensymm/env:simulator already speak via remote/server.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    +<*>
    +<../platform/teensy/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/teensy/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

; Bench stress test on the Teensy: env:teensymm with the synthetic CAN bus
; in place of FlexCAN, the same sweeping fabricated data env:dash_s3_stress
; shows, and the same STRESS_TEST backlight behaviour. Touch stays
; capacitive (teensy_platform.cpp's default).
;   pio run -e teensymm_stress -t upload
[env:teensymm_stress]
extends     = env:teensymm
build_flags =
    ${env:teensymm.build_flags}
    -D TEENSY_FAKE_CAN=1
    -D STRESS_TEST=1

[env:simulator]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    +<*>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/
    -lSDL2

; The dash product on an ESP32-S3-DevKitC-1 (N16R8: 16MB quad flash, 8MB
; octal PSRAM). Same src/main.cpp and the same core/gui/remote sources as
; env:teensymm; only the board layer differs -- platform/esp32_common
; (MCU-level: clock, NVS config store, LittleFS) plus platform/dash_s3
; (board-level: ILI9488 over 8-bit i80 rendered whole-frame from PSRAM and
; pushed on the panel's TE pulse, FT6236, TWAI). There is no C3: the S3's
; own Wi-Fi runs the C3's relay code (platform/esp32, minus its main.cpp)
; in-process, over an in-memory pipe to remote/server.
; Every pin is a -D with a default in platform/dash_s3/inc/dash_s3_pins.hpp;
; override here after wiring, don't edit a driver.
;   pio run -e dash_s3 -t upload ; pio device monitor -e dash_s3
[env:dash_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; The octal-PSRAM module needs the qio_opi precompiled SDK variant; the
; board json defaults to the no-PSRAM 8MB part, so flash size and the
; partition table (no OTA, big LittleFS) are ours too.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = platform/dash_s3/partitions_dash.csv
board_build.filesystem          = littlefs

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Arduino-ESP32 2.x defaults to gnu++11; core/ needs C++17.
build_unflags = -std=gnu++11

; Teensy-only vendored libs. Nothing here includes them; this keeps the
; dependency finder from ever considering them.
lib_ignore = FlexCAN_T4, ILI948x_t4_mm
; The in-process relay's Wi-Fi/HTTP dependencies -- see env:esp32c3.
lib_deps   = WiFi, WebServer

build_src_filter =
    +<*>
    +<../platform/esp32_common/src>
    +<../platform/dash_s3/src>
    +<../platform/esp32/src>
    -<../platform/esp32/src/main.cpp>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/simulator/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_DASH_S3
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; The bench breakout carries the resistive XPT2046, not the product's
    ; capacitive FT6236. Drop this line (or set 0) for the capacitive panel.
    -D DASH_S3_TOUCH_USE_RESISTIVE=1
    ; Without this the core disables its PSRAM init even though the
    ; qio_opi SDK libs are built with it on.
    -D BOARD_HAS_PSRAM
    ; loopTask defaults to 8KB; LVGL's software renderer and the 96px
    ; fonts want more headroom than that.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D CORE_DEBUG_LEVEL=2
    -I platform/
    -I platform/esp32_common/inc
    -I platform/dash_s3/inc
    -I platform/esp32/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

; Bench stress test: env:dash_s3 with the simulator's synthetic CAN bus in
; place of TWAI (sweeping fast and wide, unlike the simulator's gentle
; wobble) so every readout moves with no vehicle or transceiver attached,
; plus a once-a-second LCD throughput line on the console. STRESS_TEST is
; the one flag src/main.cpp itself reads: it keeps the backlight on through
; an accent/theme rebuild so the redraw can be watched.
;   pio run -e dash_s3_stress -t upload
[env:dash_s3_stress]
extends     = env:dash_s3
build_flags =
    ${env:dash_s3.build_flags}
    -D DASH_S3_FAKE_CAN=1
    -D DASH_S3_LCD_STATS=1
    -D STRESS_TEST=1

; Standalone passive CAN->USB sniffer firmware for the Mac monitor tool
; (tools/monitor). Its own program with setup()/loop() -- shares nothing with
; the display firmware except the FlexCAN_T4 library. Speaks SLCAN over USB so
; python-can's `slcan` backend can drive it. See platform/teensy/tools/
; can_sniffer.cpp and tools/README.md. Flash: pio run -e can_sniffer -t upload
[env:can_sniffer]
platform  = teensy
board     = teensy40
framework = arduino

build_src_filter =
    -<*>
    +<../platform/teensy/tools/can_sniffer.cpp>

build_flags =
    -I lib/

[env:esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

; The relay's Wi-Fi/HTTP dependencies, named rather than discovered: the
; dependency finder only follows includes from the sources it compiles,
; not from headers under -I, and main.cpp reaches these through
; relay_app.hpp.
lib_deps = WiFi, WebServer

build_src_filter =
    -<*>
    +<../platform/esp32/src>
    +<../remote/protocol/src>

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I platform/
    -I platform/esp32/inc
    -I remote/protocol/inc

monitor_speed = 115200

; Host-native layout preview for the phone config form -- no hardware, no
; RelayLink/WebServer, just the real render_config_page() (shared with
; env:esp32c3) fed fabricated sample data. See platform/esp32/README.md.
[env:web_preview]
platform    = native
lib_archive = false

build_src_filter =
    -<*>
    +<../platform/esp32/tools>
    +<../platform/esp32/src/config_page_render.cpp>
    +<../core/vehicle/src>
    +<../core/can/src>

build_flags =
    -std=gnu++17
    -I platform/
    -I platform/esp32/inc
    -I core/vehicle/inc
    -I core/can/inc
    -I remote/protocol/inc
