 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; This file is where every product- and board-specific choice is made, which
; is what lets the source tree carry no #ifdef PLATFORM_* outside platform/.
; Three separate things are selected per environment, all the same way:
;
;   the board      build_src_filter includes one platform/<board>/src
;   the product    build_src_filter includes ONE of src/main.cpp (the CAN
;                  dashboard) or src/main_gauge.cpp (the analog gauge)
;   the catalog    the include path carries one core/vehicle/generated/
;                  <product>/, since the two products share no signals
;
; src/ is listed explicitly rather than globbed with +<*>. There are two
; composition roots in there now, and a glob compiles both into one binary
; -- which fails on the include path long before it fails on two setup()s,
; and reads as a missing header rather than as what it is.
;
; Separately, env:esp32c3 is the companion ESP32-C3 relay firmware (see
; platform/esp32/README.md) -- the other end of the remote/protocol wire
; format env:teensymm/env:simulator already speak via remote/server. It is
; the CAN product's only; the gauge board's Wi-Fi is on-die.

[env:teensymm]
platform  = teensy
board     = teensymm
framework = arduino

build_src_filter =
    ; Explicit, not +<*>: src/ holds two composition roots now, and a
    ; glob would compile the other product's into this one.
    -<*>
    +<main.cpp>
    +<app>
    +<../platform/teensy/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/esp32/src>
    -<../platform/simulator/src>

build_flags =
    -D PLATFORM_TEENSY
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/teensy/inc
    -I core/time/inc
    -I core/can/inc
    -I core/vehicle/inc
    -I core/vehicle/generated/mqb
    -I core/can/generated/mqb
    -I core/config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/

[env:simulator]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    ; Explicit, not +<*> -- see env:teensymm.
    -<*>
    +<main.cpp>
    +<app>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/can/src>
    +<../core/input/src>
    +<../core/sensors/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/device_config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src>
    +<../gui/bindings/src>
    +<../remote/protocol/src>
    +<../remote/server/src>
    -<../platform/teensy/src>
    -<../platform/esp32/src>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/can/inc
    -I core/input/inc
    -I core/sensors/inc
    -I core/vehicle/inc
    -I core/vehicle/generated/mqb
    -I core/can/generated/mqb
    -I core/config/inc
    -I core/device_config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I remote/protocol/inc
    -I remote/server/inc
    -I lib/
    -lSDL2

; The gauge product's simulator: the analog-gauge composition root
; (src/main_gauge.cpp) on the same platform/simulator sources env:simulator
; uses, at 320x172 with two buttons instead of a touchscreen. The buttons
; are drawn in a strip beside the emulated panel and pressed with the mouse
; or with 'a'/'b' (aliases '1'/'2'); keys are the only way to press both at
; once, which a chord gesture needs and one mouse cursor cannot do. 'f'
; cycles which analog channel is faking an open circuit, and holding 'p'
; collapses oil pressure to a fault-level reading.
;
; Two envs rather than one that switches: env:simulator keeps rendering the
; MQB product, so a shared-code refactor stays regression-testable against
; the thing it must not change. One command proves both products still
; build and run.
;
; Three differences from env:simulator beyond the flags, all of them
; subtractive, and all of them stating that this product does not have the
; hardware in question:
;
;   - src/main.cpp is out and src/main_gauge.cpp is in. Same mechanism as
;     picking a platform/<board>/src -- the composition root is selected by
;     configuration, never by an #ifdef.
;   - core/can and remote/ are not compiled at all. There is no vehicle bus
;     and no companion ESP32-C3; on this product Wi-Fi is on-die (Phase 7).
;   - Only the screens this product has. The other seven are MQB UI, and
;     compiling them here would let a change to a screen that does not
;     exist on this board break its build.
;
; The include path picks core/vehicle/generated/gauge, so this is also the
; env that keeps the gauge signal catalog honest -- nothing else compiles it.
[env:simulator_gauge]
platform        = native
lib_archive     = false
test_build_src  = yes

extra_scripts =
    pre:support/sdl2_paths.py
    post:support/sdl2_build_extra.py

build_src_filter =
    -<*>
    +<main_gauge.cpp>
    +<app>
    +<../platform/simulator/src>
    +<../core/time/src>
    +<../core/input/src>
    +<../core/sensors/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/device_config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src/info_screen.cpp>
    +<../gui/screens/src/layout.cpp>
    +<../gui/screens/src/screen_helpers.cpp>
    +<../gui/screens/src/zoom_cycle.cpp>
    +<../gui/bindings/src/vehicle_binding.cpp>

build_flags =
    -std=gnu++17
    -D PLATFORM_SIMULATOR
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D SIM_PANEL_W=320
    -D SIM_PANEL_H=172
    -D SIM_HAS_BUTTONS=1
    -D SIM_HAS_ANALOG=1
    ; A tenth of this panel, not a tenth of the MQB one -- the default is
    ; sized for 480x320 and would carry 5x more partial-render buffer than
    ; this display can ever fill.
    -D LVGL_DRAW_BUF_PIXELS=5504
    -I platform/
    -I platform/simulator/inc
    -I core/time/inc
    -I core/input/inc
    -I core/sensors/inc
    -I core/vehicle/inc
    -I core/vehicle/generated/gauge
    -I core/config/inc
    -I core/device_config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I lib/
    -lSDL2

; The analog gauge product on real hardware: ESP32-S3 driving an ST7789V2
; 320x172 SPI strip, three analog senders through an ADS1115, two buttons.
; Same src/main_gauge.cpp and same gauge catalog as env:simulator_gauge --
; the only thing that changes is which platform/<board>/src is compiled.
; That is the whole payoff of the layering: nothing above platform/ was
; edited to accept a real board.
;
;   pio run -e esp32s3_gauge -t upload
;
; NOTHING HERE HAS BEEN RUN ON HARDWARE. The board does not exist yet, so
; this builds and links and is otherwise unverified. Three things in
; particular will need a scope or an eye on the panel before they are
; believed -- they are documented where they live rather than here:
;   * the ST7789 GRAM offset and MADCTL rotation (esp32s3_display.cpp)
;   * RGB565 byte order on the wire (same file)
;   * ADS1115 timing and noise (esp32s3_analog_input.cpp)
;
; THE PINOUT IS NOT FROZEN. Every pin is a -D with a default that avoids
; the S3's strapping, USB, flash and octal-PSRAM pins; see
; platform/esp32s3/inc/esp32s3_pins.hpp. Override them here when the PCB
; settles rather than editing a driver.
;
; Board: esp32-s3-devkitc-1 is the generic S3 module. The plan's part is an
; N16R8 (16MB flash, 8MB octal PSRAM), so flash size and the partition
; table are set explicitly below. PSRAM is deliberately NOT enabled -- at
; 320x172 the LVGL buffers are a few KB and nothing else here needs it, so
; turning it on would only cost boot time.
[env:esp32s3_gauge]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = platform/esp32s3/partitions_gauge.csv

monitor_speed = 115200

; Arduino-ESP32 2.x compiles at gnu++11 by default. core/ uses inline
; constexpr variables (the generated catalog counts) and `for (x : y)` over
; brace-initialised tables, both of which need C++17 -- and the Teensy and
; native builds have always been C++17, so this is bringing the third
; toolchain in line rather than raising a bar.
build_unflags = -std=gnu++11

build_src_filter =
    -<*>
    +<main_gauge.cpp>
    +<app>
    +<../platform/esp32s3/src>
    +<../core/time/src>
    +<../core/input/src>
    +<../core/sensors/src>
    +<../core/vehicle/src>
    +<../core/config/src>
    +<../core/device_config/src>
    +<../core/logging/src>
    +<../gui/theme/src>
    +<../gui/widgets/src>
    +<../gui/assets/fonts>
    +<../gui/screens/src/info_screen.cpp>
    +<../gui/screens/src/layout.cpp>
    +<../gui/screens/src/screen_helpers.cpp>
    +<../gui/screens/src/zoom_cycle.cpp>
    +<../gui/bindings/src/vehicle_binding.cpp>

build_flags =
    -std=gnu++17
    -D PLATFORM_ESP32S3
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; A tenth of this panel, matching env:simulator_gauge. The default is
    ; sized for 480x320 and would carry five times more partial-render
    ; buffer than this display can ever fill.
    -D LVGL_DRAW_BUF_PIXELS=5504
    -I platform/
    -I platform/esp32s3/inc
    -I core/time/inc
    -I core/input/inc
    -I core/sensors/inc
    -I core/vehicle/inc
    -I core/vehicle/generated/gauge
    -I core/config/inc
    -I core/device_config/inc
    -I core/logging/inc
    -I gui/theme/inc
    -I gui/widgets/inc
    -I gui/screens/inc
    -I gui/bindings/inc
    -I lib/

; Standalone passive CAN->USB sniffer firmware for the Mac monitor tool
; (tools/monitor). Its own program with setup()/loop() -- shares nothing with
; the display firmware except the FlexCAN_T4 library. Speaks SLCAN over USB so
; python-can's `slcan` backend can drive it. See platform/teensy/tools/
; can_sniffer.cpp and tools/README.md. Flash: pio run -e can_sniffer -t upload
[env:can_sniffer]
platform  = teensy
board     = teensy40
framework = arduino

build_src_filter =
    -<*>
    +<../platform/teensy/tools/can_sniffer.cpp>

build_flags =
    -I lib/

[env:esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

build_src_filter =
    -<*>
    +<../platform/esp32/src>
    +<../remote/protocol/src>

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I platform/
    -I platform/esp32/inc
    -I remote/protocol/inc

monitor_speed = 115200

; Host-native layout preview for the phone config form -- no hardware, no
; RelayLink/WebServer, just the real render_config_page() (shared with
; env:esp32c3) fed fabricated sample data. See platform/esp32/README.md.
[env:web_preview]
platform    = native
lib_archive = false

build_src_filter =
    -<*>
    +<../platform/esp32/tools>
    +<../platform/esp32/src/config_page_render.cpp>
    +<../core/vehicle/src>
    +<../core/can/src>

build_flags =
    -std=gnu++17
    -I platform/
    -I platform/esp32/inc
    -I core/vehicle/inc
    -I core/vehicle/generated/mqb
    -I core/can/inc
    -I core/can/generated/mqb
    -I remote/protocol/inc
